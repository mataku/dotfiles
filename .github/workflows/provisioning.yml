name: Provisioning

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: "read"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Configure brew bundle for CI
      run: |
        ids=$(grep -oE 'id: [0-9]+' ~/src/github.com/mataku/dotfiles/Brewfile | awk '{print $2}' | xargs)
        echo "HOMEBREW_BUNDLE_MAS_SKIP=$ids" >> "$GITHUB_ENV"
        echo "HOMEBREW_BUNDLE_NO_UPGRADE=1" >> "$GITHUB_ENV"

    - name: Run setup script
      run: |
        bash ~/src/github.com/mataku/dotfiles/setup.sh
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"

    - name: Add mise to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify Brewfile is satisfied
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        brew bundle check --file="$HOME/src/github.com/mataku/dotfiles/Brewfile" --verbose

    - name: Verify dotfiles and macOS defaults are applied
      run: |
        cd "$HOME/src/github.com/mataku/dotfiles"
        mise bootstrap dotfiles status --missing
        mise bootstrap macos defaults status --missing

    - name: Verify key packages are installed
      run: |
        for bin in bat fzf rg git zsh fish nvim herdr; do
          test -x "/opt/homebrew/bin/$bin" || { echo "::error::$bin is missing"; exit 1; }
        done
        ~/.nodenv/shims/node --version || { echo "::error::nodenv has no Node.js"; exit 1; }

    - name: Verify CLAUDE.md is copied from the template
      run: |
        test -f ~/.claude/CLAUDE.md || { echo "::error::~/.claude/CLAUDE.md is missing"; exit 1; }
        test ! -L ~/.claude/CLAUDE.md || { echo "::error::~/.claude/CLAUDE.md must be a copy, not a symlink"; exit 1; }
        cmp ~/.claude/CLAUDE.md ~/src/github.com/mataku/dotfiles/claude/CLAUDE.md.tpl || { echo "::error::~/.claude/CLAUDE.md differs from claude/CLAUDE.md.tpl"; exit 1; }

    - name: Verify zsh initialization
      env:
        TERM: xterm-256color
      run: |
        ZDOTDIR="$HOME/.config/zsh" /opt/homebrew/bin/zsh -ic 'exit' 2>&1

    - name: Verify fish initialization
      env:
        TERM: xterm-256color
      run: |
        output=$(/opt/homebrew/bin/fish -c 'exit' 2>&1)
        if [ -n "$output" ]; then
          echo "$output"
          exit 1
        fi

    - name: Verify nvim initialization
      run: |
        /opt/homebrew/bin/nvim --headless "+qa" 2>&1

    - name: Verify herdr initialization
      run: |
        /opt/homebrew/bin/herdr --version

    - name: Install herdr.app for config verification
      run: curl -fsSL https://releases.herdr.dev/app/install.sh | sh

    - name: Verify herdr.app config
      run: bash ~/src/github.com/mataku/dotfiles/scripts/ci/verify-herdr-app.sh

    - name: Install wezterm for config verification
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: brew install --cask wezterm

    - name: Refresh font cache for wezterm verification
      run: /opt/homebrew/bin/fc-cache -vf

    - name: Verify wezterm config
      run: bash ~/src/github.com/mataku/dotfiles/scripts/ci/verify-wezterm.sh

    - name: Notify Discord on failure
      if: failure()
      run: |
        curl -sS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "Provisioning failed",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": 15548997,
              "fields": [
                { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Trigger", "value": "`${{ github.event_name }}`", "inline": true }
              ]
            }]
          }'

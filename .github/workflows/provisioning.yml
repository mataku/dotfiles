name: Provisioning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      with:
        logger: pretty
        extra-conf: |
          accept-flake-config = true

    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

    - name: Check flake
      run: nix flake check --show-trace

    - name: Build nix-darwin configuration
      run: |
        nix build .#darwinConfigurations.mataku-macbook.system \
          --extra-experimental-features "nix-command flakes" --impure \
          --show-trace

    - name: Verify key packages
      run: |
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.home.packages \
          --apply 'pkgs: builtins.map (p: p.pname or p.name or "unknown") pkgs' \
          --json | jq -r '.[]' | grep -E "(bat|fzf|ripgrep|git|fish)"

    - name: Check configurations
      run: |
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.xdg.enable
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.programs.fish.enable
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.programs.git.enable

  install:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

    - name: Run installation script
      run: |
        bash ~/src/github.com/mataku/dotfiles/scripts/install.sh
      env:
        NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

    - name: Verify Nix packages are installed
      run: |
        # Check that Nix profile exists
        test -d ~/.nix-profile/bin || exit 1

        # Verify key packages are accessible
        ~/.nix-profile/bin/bat --version
        ~/.nix-profile/bin/fzf --version
        ~/.nix-profile/bin/git --version
        ~/.nix-profile/bin/fish --version
        ~/.nix-profile/bin/ripgrep --version

    - name: Verify XDG directories
      run: |
        # Check XDG directories are created
        test -d ~/.config || exit 1
        test -d ~/.local/share || exit 1
        test -d ~/.cache || exit 1
        test -d ~/.local/state || exit 1

    - name: Verify dotfiles are symlinked
      run: |
        # Check that dotfiles are properly symlinked via XDG
        test -L ~/.config/nvim || test -d ~/.config/nvim || exit 1
        test -f ~/.config/fish/config.fish || exit 1
        test -f ~/.config/git/config || exit 1
        test -f ~/.config/tig/config || exit 1
        test -f ~/.config/ripgrep/config || exit 1
        test -f ~/.config/git/commit_template || exit 1

    - name: Verify Fish shell works
      run: |
        # Test Fish shell can start
        ~/.nix-profile/bin/fish --version
        ~/.nix-profile/bin/fish -c "echo 'Fish shell works'"

    - name: Verify environment variables
      run: |
        # Check XDG environment variables are set
        ~/.nix-profile/bin/fish -c 'test -n "$XDG_CONFIG_HOME"; or exit 1'
        ~/.nix-profile/bin/fish -c 'test "$XDG_CONFIG_HOME" = "$HOME/.config"; or exit 1'
        ~/.nix-profile/bin/fish -c 'test -n "$EDITOR"; or exit 1'
        ~/.nix-profile/bin/fish -c 'test "$EDITOR" = "nvim"; or exit 1'

    - name: Verify direnv integration
      run: |
        # Check direnv is available
        ~/.nix-profile/bin/direnv --version

    - name: Check darwin-rebuild
      run: |
        # Verify darwin-rebuild is available and can list generations
        darwin-rebuild --list-generations

    - name: Verify Git configuration
      run: |
        # Check Git is configured correctly
        ~/.nix-profile/bin/git config --get user.name
        ~/.nix-profile/bin/git config --get user.email

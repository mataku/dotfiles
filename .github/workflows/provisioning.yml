name: Provisioning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      id-token: "write"
      contents: "read"

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Check flake
      run: nix --extra-experimental-features "nix-command flakes" flake check --show-trace

    - name: Build nix-darwin configuration
      run: |
        nix build .#darwinConfigurations.macos.system \
          --extra-experimental-features "nix-command flakes" --impure \
          --show-trace

    - name: Verify key packages
      run: |
        nix eval .#darwinConfigurations.macos.config.home-manager.users.$USER.home.packages \
          --extra-experimental-features "nix-command flakes" \
          --apply 'pkgs: builtins.map (p: p.pname or p.name or "unknown") pkgs' \
          --impure --json | jq -r '.[]' | grep -E "(bat|fzf|ripgrep|git|zsh)"

    - name: Check configurations
      run: |
        nix eval .#darwinConfigurations.macos.config.home-manager.users.$USER.xdg.enable --impure --extra-experimental-features "nix-command flakes"
        nix eval .#darwinConfigurations.macos.config.home-manager.users.$USER.programs.zsh.enable --impure --extra-experimental-features "nix-command flakes"
        nix eval .#darwinConfigurations.macos.config.home-manager.users.$USER.programs.git.enable --impure --extra-experimental-features "nix-command flakes"

  install:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Run installation script
      run: |
        bash ~/src/github.com/mataku/dotfiles/scripts/install.sh
      env:
        NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

    - name: Verify Nix packages are installed
      run: |
        # Check that Nix profile exists
        brew install tree
        tree $HOME/.nix-profile/bin
  
    - name: Verify dotfiles are symlinked
      run: |
        # Check that dotfiles are properly symlinked via XDG
        test -L ~/.config/nvim || test -d ~/.config/nvim || exit 1
        test -f ~/.config/zsh/.zshrc || exit 1
        test -f ~/.gitconfig || exit 1 # ~/.config/git/config
        test -f ~/.config/tig/config || exit 1
        test -f ~/.config/ripgrep/config || exit 1
        test -f ~/.config/git/commit_template || exit 1
        test -f ~/.config/zsh-abbr/user-abbreviations || exit 1

    - name: Verify zsh initialization
      run: |
        ZDOTDIR="$HOME/.config/zsh" zsh -ic 'exit' 2>&1

    - name: Verify tmux initialization
      run: |
        tmux new-session -d -s test \; kill-session -t test

name: Provisioning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      id-token: "write"
      contents: "read"

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703 # v30
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
      with:
        # restore and save a cache using this key
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        # if there's no cache hit, restore a cache by this prefix
        restore-prefixes-first-match: nix-${{ runner.os }}-
        # do purge caches
        purge: true
        # purge all versions of the cache
        purge-prefixes: nix-${{ runner.os }}-
        # created more than this number of seconds ago
        purge-created: 0
        # or last accessed this duration (ISO 8601 duration format)
        # before the start of the `Post Restore and save Nix store` phase
        purge-last-accessed: P1DT12H
        # except any version with the key that is the same as the `primary-key`
        purge-primary-key: never

    - name: Check flake
      run: nix --extra-experimental-features "nix-command flakes" flake check --show-trace

    - name: Build nix-darwin configuration
      run: |
        nix build .#darwinConfigurations.mataku-macbook.system \
          --extra-experimental-features "nix-command flakes" --impure \
          --show-trace

    - name: Verify key packages
      run: |
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.home.packages \
          --extra-experimental-features "nix-command flakes" \
          --apply 'pkgs: builtins.map (p: p.pname or p.name or "unknown") pkgs' \
          --impure --json | jq -r '.[]' | grep -E "(bat|fzf|ripgrep|git|fish)"

    - name: Check configurations
      run: |
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.xdg.enable --impure --extra-experimental-features "nix-command flakes"
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.programs.fish.enable --impure --extra-experimental-features "nix-command flakes"
        nix eval .#darwinConfigurations.mataku-macbook.config.home-manager.users.$USER.programs.git.enable --impure --extra-experimental-features "nix-command flakes"

  install:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Run installation script
      run: |
        bash ~/src/github.com/mataku/dotfiles/scripts/install.sh
      env:
        NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

    - name: Verify Nix packages are installed
      run: |
        # Check that Nix profile exists
        brew install tree
        tree /etc/profiles/per-user/$USER/bin
  
    - name: Verify dotfiles are symlinked
      run: |
        # Check that dotfiles are properly symlinked via XDG
        test -L ~/.config/nvim || test -d ~/.config/nvim || exit 1
        test -f ~/.config/fish/config.fish || exit 1
        test -f ~/.config/git/config || exit 1
        test -f ~/.config/tig/config || exit 1
        test -f ~/.config/ripgrep/config || exit 1
        test -f ~/.config/git/commit_template || exit 1

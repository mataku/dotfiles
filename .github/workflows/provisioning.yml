name: Provisioning

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: "read"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Run installation script
      run: |
        bash ~/src/github.com/mataku/dotfiles/scripts/install.sh
      env:
        NIX_CONFIG: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          max-jobs = auto
          http-connections = 50
          experimental-features = nix-command flakes

    - name: Verify key packages are installed
      run: |
        ls "$HOME/.nix-profile/bin" | grep -E "^(bat|fzf|rg|git|zsh|fish|tmux|nvim)$"

    - name: Verify dotfiles are symlinked
      run: |
        # Check that dotfiles are properly symlinked via XDG
        test -L ~/.config/nvim || test -d ~/.config/nvim || exit 1
        test -f ~/.config/zsh/.zshrc || exit 1
        test -f ~/.gitconfig || exit 1 # ~/.config/git/config
        test -f ~/.config/tig/config || exit 1
        test -f ~/.config/ripgrep/config || exit 1
        test -f ~/.config/git/commit_template || exit 1
        test -f ~/.config/zsh-abbr/user-abbreviations || exit 1
        test -f ~/.config/fish/config.fish || exit 1
        test -f ~/.claude/settings.json || exit 1
        test -f ~/.claude/hooks/permission-notify.sh || exit 1
        test -f ~/.claude/hooks/idle-notify.sh || exit 1

    - name: Verify zsh initialization
      env:
        TERM: xterm-256color
      run: |
        ZDOTDIR="$HOME/.config/zsh" ~/.nix-profile/bin/zsh -ic 'exit' 2>&1

    - name: Verify fish initialization
      env:
        TERM: xterm-256color
      run: |
        output=$(~/.nix-profile/bin/fish -c 'exit' 2>&1)
        if [ -n "$output" ]; then
          echo "$output"
          exit 1
        fi

    - name: Verify tmux initialization
      run: |
        ~/.nix-profile/bin/tmux new-session -d -s test \; kill-session -t test

    - name: Verify nvim initialization
      run: |
        ~/.nix-profile/bin/nvim --headless "+qa" 2>&1

    - name: Install wezterm and Cica font for config verification
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: brew install --cask wezterm font-cica

    - name: Refresh font cache for wezterm verification
      run: ~/.nix-profile/bin/fc-cache -vf

    - name: Verify wezterm config
      run: |
        set +e
        output=$(/Applications/WezTerm.app/Contents/MacOS/wezterm --config-file ~/.config/wezterm/wezterm.lua ls-fonts 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ $status -ne 0 ]; then
          echo "::error::wezterm exited with status $status"
          exit $status
        fi
        if echo "$output" | grep -q "Unable to load a font"; then
          echo "::error::wezterm failed to load a configured font"
          exit 1
        fi

    - name: Notify Discord on failure
      if: failure()
      run: |
        curl -sS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "Provisioning failed",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": 15548997,
              "fields": [
                { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Trigger", "value": "`${{ github.event_name }}`", "inline": true }
              ]
            }]
          }'

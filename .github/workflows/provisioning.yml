name: Provisioning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macOS-15
    
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Provisioning
      run: |
        export HOMEBREW_BUNDLE_MAS_SKIP="$(grep mas <Brewfile | grep -v brew | awk -F 'id\: ' '{printf $2" "}')"
        /bin/bash -ex setup.sh

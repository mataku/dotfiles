name: Provisioning

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: "read"

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Run installation script
      run: |
        bash ~/src/github.com/mataku/dotfiles/scripts/install.sh
      env:
        NIX_CONFIG: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          max-jobs = auto
          http-connections = 50
          experimental-features = nix-command flakes

    - name: Verify key packages are installed
      run: |
        ls "$HOME/.nix-profile/bin" | grep -E "^(bat|fzf|rg|git|zsh|tmux|nvim)$"

    - name: Verify dotfiles are symlinked
      run: |
        # Check that dotfiles are properly symlinked via XDG
        test -L ~/.config/nvim || test -d ~/.config/nvim || exit 1
        test -f ~/.config/zsh/.zshrc || exit 1
        test -f ~/.gitconfig || exit 1 # ~/.config/git/config
        test -f ~/.config/tig/config || exit 1
        test -f ~/.config/ripgrep/config || exit 1
        test -f ~/.config/git/commit_template || exit 1
        test -f ~/.config/zsh-abbr/user-abbreviations || exit 1

    - name: Verify zsh initialization
      env:
        TERM: xterm-256color
      run: |
        ZDOTDIR="$HOME/.config/zsh" ~/.nix-profile/bin/zsh -ic 'exit' 2>&1

    - name: Verify tmux initialization
      run: |
        ~/.nix-profile/bin/tmux new-session -d -s test \; kill-session -t test

    - name: Verify nvim initialization
      run: |
        ~/.nix-profile/bin/nvim --headless "+qa" 2>&1

    - name: Install wezterm for config verification
      run: brew install --cask wezterm

    - name: Install Cica font for wezterm config verification
      run: brew install --cask font-cica

    - name: Verify wezterm config
      run: |
        /Applications/WezTerm.app/Contents/MacOS/wezterm --config-file ~/.config/wezterm/wezterm.lua ls-fonts > /dev/null

name: Provisioning

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: ${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: "read"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: dotfiles

    - name: Setup dotfiles
      run: |
        mkdir -p ~/src/github.com/mataku
        mv dotfiles ~/src/github.com/mataku/

    - name: Configure brew bundle for CI
      run: |
        ids=$(grep -oE 'id: [0-9]+' ~/src/github.com/mataku/dotfiles/Brewfile | awk '{print $2}' | xargs)
        echo "HOMEBREW_BUNDLE_MAS_SKIP=$ids" >> "$GITHUB_ENV"
        echo "HOMEBREW_BUNDLE_NO_UPGRADE=1" >> "$GITHUB_ENV"

    - name: Run setup script
      run: |
        bash ~/src/github.com/mataku/dotfiles/setup.sh
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"

    - name: Add mise to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify Brewfile is satisfied
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        brew bundle check --file="$HOME/src/github.com/mataku/dotfiles/Brewfile" --verbose

    - name: Verify dotfiles and macOS defaults are applied
      run: |
        cd "$HOME/src/github.com/mataku/dotfiles"
        mise bootstrap dotfiles status --missing
        mise bootstrap macos defaults status --missing

    - name: Verify key packages are installed
      run: |
        for bin in bat fzf rg git zsh fish nvim herdr; do
          test -x "/opt/homebrew/bin/$bin" || { echo "::error::$bin is missing"; exit 1; }
        done

    - name: Verify dotfiles are symlinked
      run: |
        test -L ~/.config/nvim/init.lua || exit 1
        test -L ~/.config/nvim/lua || exit 1
        test -L ~/.config/wezterm/wezterm.lua || exit 1
        test -L ~/.config/ghostty/config || exit 1
        test -L ~/.config/herdr/config.toml || exit 1
        test -L "$HOME/Library/Application Support/lazygit/config.yml" || exit 1
        test -L ~/.config/tig/config || exit 1
        test -L ~/.config/ripgrep/config || exit 1
        test -L ~/.config/git/commit_template || exit 1
        test -L ~/.config/zsh/.zshrc || exit 1
        test -L ~/.config/zsh-abbr/user-abbreviations || exit 1
        test -L ~/.zshenv || exit 1
        test -L ~/.config/fish/config.fish || exit 1
        test -L ~/.config/fish/functions || exit 1
        test -L ~/.gitconfig || exit 1
        test -L ~/.irbrc || exit 1
        test -L ~/.gemrc || exit 1
        test -L ~/.claude/hooks/permission-notify.sh || exit 1
        test -L ~/.claude/hooks/idle-notify.sh || exit 1

    - name: Verify zsh initialization
      env:
        TERM: xterm-256color
      run: |
        ZDOTDIR="$HOME/.config/zsh" /opt/homebrew/bin/zsh -ic 'exit' 2>&1

    - name: Verify fish initialization
      env:
        TERM: xterm-256color
      run: |
        output=$(/opt/homebrew/bin/fish -c 'exit' 2>&1)
        if [ -n "$output" ]; then
          echo "$output"
          exit 1
        fi

    - name: Verify nvim initialization
      run: |
        /opt/homebrew/bin/nvim --headless "+qa" 2>&1

    - name: Verify herdr initialization
      run: |
        /opt/homebrew/bin/herdr --version

    - name: Install wezterm for config verification
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: brew install --cask wezterm

    - name: Refresh font cache for wezterm verification
      run: /opt/homebrew/bin/fc-cache -vf

    - name: Verify wezterm config
      run: |
        set +e
        output=$(/Applications/WezTerm.app/Contents/MacOS/wezterm --config-file ~/.config/wezterm/wezterm.lua ls-fonts 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ $status -ne 0 ]; then
          echo "::error::wezterm exited with status $status"
          exit $status
        fi
        if echo "$output" | grep -q "Unable to load a font"; then
          echo "::error::wezterm failed to load a configured font"
          exit 1
        fi

    - name: Notify Discord on failure
      if: failure()
      run: |
        curl -sS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "Provisioning failed",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": 15548997,
              "fields": [
                { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Trigger", "value": "`${{ github.event_name }}`", "inline": true }
              ]
            }]
          }'

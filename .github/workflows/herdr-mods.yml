name: Herdr Mods

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'herdr-app/mods/**'
      - '.github/workflows/herdr-mods.yml'
  push:
    branches:
      - develop
    paths:
      - 'herdr-app/mods/**'
      - '.github/workflows/herdr-mods.yml'
  schedule:
    - cron: '00 13 1 * *'

concurrency:
  group: herdr-mods-${{ github.head_ref || 'develop' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: "read"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: latest

    - name: Test mods
      run: node --test herdr-app/mods/*/*.test.js

    - name: Compile the simulators viewer's scaler
      run: xcrun swiftc -O -o "$RUNNER_TEMP/scaler" herdr-app/mods/simulators/viewer/scaler.swift

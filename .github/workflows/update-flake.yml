name: Update Flake Lock

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 12:00 JST (03:00 UTC)
    - cron: '0 3 * * 5'

permissions:
  contents: write
  pull-requests: write

env:
  PR_BRANCH: update-flake-lock

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Configure git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Capture package versions (before)
      env:
        USER: runner
      run: bash scripts/nix-capture-versions.sh /tmp/packages-before.json

    - name: Update flake.lock
      id: update
      run: |
        set -euo pipefail
        nix flake update
        if git diff --quiet -- flake.lock; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "flake.lock unchanged; nothing to do."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Capture package versions (after)
      if: steps.update.outputs.changed == 'true'
      env:
        USER: runner
      run: bash scripts/nix-capture-versions.sh /tmp/packages-after.json

    - name: Generate version diff
      if: steps.update.outputs.changed == 'true'
      run: bash scripts/nix-version-diff.sh /tmp/packages-before.json /tmp/packages-after.json /tmp/diff.md

    - name: Commit and push
      if: steps.update.outputs.changed == 'true'
      run: |
        set -euo pipefail
        git checkout -B "$PR_BRANCH"
        git add flake.lock
        git commit \
          -m "chore: update flake.lock" \
          -m "Automated flake.lock update"
        git push --force origin "$PR_BRANCH"

    - name: Create or update PR
      if: steps.update.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        BASE_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        {
          echo "## Automated Flake Update"
          echo ""
          echo "This PR updates \`flake.lock\` to the latest versions of dependencies."
          echo ""
          cat /tmp/diff.md
        } > /tmp/pr-body.md

        PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$PR_NUMBER" ]; then
          gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md
        else
          gh pr create \
            --head "$PR_BRANCH" \
            --base "$BASE_BRANCH" \
            --title "chore: update flake.lock" \
            --body-file /tmp/pr-body.md \
            --label dependencies \
            --reviewer mataku
        fi

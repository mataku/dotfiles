name: Update Flake Lock

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 12:00 JST (03:00 UTC)
    - cron: '0 3 * * 5'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Capture package versions (before)
      env:
        USER: runner
      run: bash scripts/nix-capture-versions.sh /tmp/packages-before.json

    - name: Update flake.lock
      uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
      with:
        token: ${{ steps.app-token.outputs.token }}
        pr-title: "chore: update flake.lock"
        pr-labels: |
          dependencies
        commit-msg: |
          chore: update flake.lock

          Automated flake.lock update by update-flake-lock action
        branch: update-flake-lock
        pr-body: |
          ## Automated Flake Update

          This PR updates `flake.lock` to the latest versions of dependencies.

          ### Updated inputs
          The following Nix flake inputs have been updated:
          - nixpkgs
          - nix-darwin
          - home-manager

          ### Merge guidelines
          Please review the changes and merge if CI passes successfully.

          ---
          *Automatically generated by [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock)*

    - name: Capture package versions (after)
      env:
        USER: runner
      run: bash scripts/nix-capture-versions.sh /tmp/packages-after.json

    - name: Generate version diff
      run: bash scripts/nix-version-diff.sh /tmp/packages-before.json /tmp/packages-after.json /tmp/diff.md

    - name: Post version diff comment
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        PR_NUMBER=$(gh pr list --head update-flake-lock --json number --jq '.[0].number')
        if [ -n "$PR_NUMBER" ]; then
          gh pr comment "$PR_NUMBER" --body-file /tmp/diff.md
        fi

    - name: Request review
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        PR_NUMBER=$(gh pr list --head update-flake-lock --json number --jq '.[0].number')
        if [ -n "$PR_NUMBER" ]; then
          gh pr edit "$PR_NUMBER" --add-reviewer mataku
        fi

onboarding = false
# Herdr configuration
# Docs: https://herdr.dev/docs/configuration/
# Full defaults: `herdr --default-config`

[theme.custom]
overlay0 = "#9399b2"

[update]
# Herdr is installed via Homebrew, which owns updates.
version_check = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "non_login"

[keys]
# Match tmux prefix (C-q) for muscle-memory continuity.
prefix = "ctrl+q"

# Match tmux bind-key | split-window -h (vertical divider).
# split_horizontal keeps the default (prefix+minus), which matches
# tmux bind-key - split-window -v.
split_vertical = "prefix+|"
close_tab = "prefix+x"
close_pane = "prefix+shift+x"

[ui.sidebar.agents]
row_gap = 1

[ui.sidebar.spaces]
row_gap = 1
